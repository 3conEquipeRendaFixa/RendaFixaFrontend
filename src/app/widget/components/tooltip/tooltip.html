<div
  class="tooltip-wrapper"
  (mouseenter)="show()"
  (mouseleave)="hide()">
  <ng-content></ng-content>
  @if (visible && text()) {
    <div class="tooltip-box" [class.top]="position() === 'top'" [class.bottom]="position() === 'bottom'">
      <span class="tooltip-text">{{ text() }}</span>
      <div class="tooltip-arrow"></div>
    </div>
  }
</div>
