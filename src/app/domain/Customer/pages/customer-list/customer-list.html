<main class="customer-list-page">
  <srf-b3-breadcrumb [items]="breadcrumbItems" />

  <div class="screen-header">
    <h1 class="screen-title">Cadastro de Clientes</h1>
    <span class="screen-subtitle">Consulta</span>
  </div>

  <div class="main-content">
    <section class="filter-section">
      <srf-b3-filter-panel
        [fields]="filterFields"
        [filterValues]="filterValues()"
        [gridTemplate]="'1.1fr 0.8fr 1fr 1.6fr 3.5fr 1fr'"
        (search)="onFilterSearch($event)"
        (filtersChanged)="onFiltersChanged($event)"
        (clear)="onFilterClear()"
      />
    </section>

    @if (hasSearched()) {
      <div class="grid-section">
        <srf-b3-grid
          [columns]="gridColumns"
          [data]="paginatedCustomers()"
          [actions]="gridActions"
          [trackByKey]="'custCode'"
          [showColumnDividers]="true"
          (rowClick)="onRowClick($event)"
          (actionClick)="onActionClick($event)"
        >
          <ng-template gridCellDef="statRegCode" let-item>
            <srf-b3-status-badge [status]="item.statRegCode" />
          </ng-template>
        </srf-b3-grid>

        <srf-b3-pagination
          [totalItems]="allCustomers().length"
          [pageSize]="pageSize()"
          [currentPage]="currentPage()"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
        />
      </div>
    } @else {
      <div class="empty-state">
        <img src="icons/lupa.svg" alt="Pesquisar" class="empty-state-icon" />
        <div class="empty-state-text">
          <span class="empty-state-title">Nenhum registro foi encontrado.</span>
          <span class="empty-state-subtitle">Utilize o filtro para pesquisar.</span>
        </div>
      </div>
    }
  </div>
</main>
