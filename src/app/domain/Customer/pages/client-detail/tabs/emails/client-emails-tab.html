<div class="emails-tab">
  @for (emailRecord of emails(); track $index) {
    <div class="email-card">
      <div class="card-border"></div>
      <div class="card-content">
        <div class="form-row">
          <!-- E-mail -->
          <div class="form-field" style="width: 380px;">
            <span class="field-label">E-mail</span>
            <div class="field-input disabled">
              <span class="placeholder-text">{{ emailRecord.email || 'email@email.com.br' }}</span>
            </div>
          </div>

          <!-- Finalidade do E-mail -->
          <div class="form-field" style="flex: 1; min-width: 300px;">
            <span class="field-label">Finalidade do E-mail</span>
            <div class="field-input has-icon disabled">
              <span class="placeholder-text">{{ emailRecord.finalidade || 'Finalidade 1, Finalidade 2, Finalidade 3' }}</span>
              <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 4L6 8L10 4" stroke="#AFAFAF" stroke-width="1.5"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
