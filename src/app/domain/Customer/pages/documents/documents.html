<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<main class="documentos-page">
  <srf-b3-breadcrumb [items]="breadcrumbItems" />

  <!-- Client Header -->
  <div class="client-header">
    <button class="back-button" (click)="goBack()" aria-label="Voltar">
      <img src="icons/voltar.svg" alt="Voltar" class="back-icon" />
    </button>

    <div class="client-info">
      <div class="client-name-row">
        <h1 class="client-name">{{ clientName() }}</h1>
        <div
          class="status-chip"
          [class.inactive]="clientStatus() === 'inativo'"
          [class.active]="clientStatus() === 'ativo'"
        >
          {{ clientStatus() === 'ativo' ? 'Ativo' : 'Inativo' }}
        </div>
      </div>
      <div class="client-modules-badge">
        <span class="badge-text">{{ clientModules() }}</span>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-wrapper">
    @for (tab of tabs; track tab.key) {
      <button
        class="tab"
        [class.active]="tab.active"
        (click)="onTabClick(tab)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <!-- Form Content -->
  <div class="form-content">
    @if (isLoading) {
      <div class="loading">
        <p>Carregando...</p>
      </div>
    } @else {
      @for (doc of documentos(); track doc.docDocmValue; let i = $index) {
        <section class="document-card">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Tipo de Documento<span class="required">*</span></label>
              <select class="form-select" disabled>
                <option>{{ doc.docDocmTypeName || 'Seleção' }}</option>
              </select>
            </div>

            <div class="form-group numero-documento">
              <label class="form-label">Número do Documento<span class="required">*</span></label>
              <input type="text" class="form-input" [value]="doc.docDocmValue" readonly placeholder="Número">
            </div>

            <div class="form-group">
              <label class="form-label">Órgão Emissor</label>
              <select class="form-select" disabled>
                <option>{{ doc.docIssuingAgencyAcrn || 'Seleção' }}</option>
              </select>
            </div>

            <div class="form-group uf-emissor">
              <label class="form-label">UF Emissor</label>
              <select class="form-select" disabled>
                <option>{{ doc.docStateAcrn || 'Seleção' }}</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">País Emissor</label>
              <select class="form-select" disabled>
                <option>{{ doc.docCountryName || 'Seleção' }}</option>
              </select>
            </div>

            <div class="form-group checkboxes">
              <div class="checkbox-wrapper">
                <input type="checkbox" [checked]="isChecked(doc.docMainDocm)" disabled>
                <label>Documento de Identificação</label>
              </div>
              <div class="checkbox-wrapper">
                <input type="checkbox" [checked]="isChecked(doc.docDomainBvmfInd)" disabled>
                <label>Cadastrar na B3</label>
              </div>
            </div>
          </div>
        </section>
      } @empty {
        <div class="empty-state">
          <p>Nenhum documento cadastrado.</p>
        </div>
      }
    }
  </div>
</main>
