<main class="calendar-page">
  <nav class="breadcrumb">
    <div class="breadcrumb-content">
      <span class="breadcrumb-item">PÁGINA INICIAL</span>
      <svg class="breadcrumb-separator" viewBox="0 0 5 9" width="5" height="9">
        <path d="M0.5 0.5L4 4.5L0.5 8.5" stroke="currentColor" stroke-width="1" fill="none"/>
      </svg>
      <span class="breadcrumb-item">ADMINISTRATIVO</span>
      <svg class="breadcrumb-separator" viewBox="0 0 5 9" width="5" height="9">
        <path d="M0.5 0.5L4 4.5L0.5 8.5" stroke="currentColor" stroke-width="1" fill="none"/>
      </svg>
      <span class="breadcrumb-item current">CALENDÁRIO POR PRAÇA</span>
    </div>
  </nav>

  <!-- Header da Tela -->
  <div class="screen-header">
    <h1 class="screen-title">Calendário por praça</h1>
  </div>

  <!-- Conteúdo Principal -->
  <div class="main-content">
    <!-- Filtro -->
    <div class="filter-section">
      <srf-b3-calendar-filter (searchFilters)="onSearch()" (clearFilters)="onClear()" />
    </div>

    <!-- Grid -->
    <div class="grid-section">
      <srf-b3-calendar-grid [items]="calendarItems()" (rowClick)="onRowClick($event)" (export)="onExport()" />
      <p class="results-info">4 resultados disponíveis.</p>
    </div>
  </div>

  <srf-b3-calendar-view-modal
    [isOpen]="isModalOpen()"
    [calendarItem]="selectedItem()"
    (closeModal)="onCloseModal()"
  />
</main>
