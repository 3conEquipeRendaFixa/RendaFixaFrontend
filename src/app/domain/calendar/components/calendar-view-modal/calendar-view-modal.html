@if (isOpen()) {
  <div class="modal-overlay" (click)="onClose()" (keydown.escape)="onClose()" tabindex="0" role="dialog" aria-modal="true">
    <div class="modal-container" (click)="$event.stopPropagation()" (keydown.escape)="$event.stopPropagation()" role="document">
      <!-- Header -->
      <header class="modal-header">
        <div class="modal-title-wrapper">
          <svg class="modal-icon" width="17" height="15" viewBox="0 0 17 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.65" y="2.15" width="15.7" height="10.7" rx="4.35" stroke="#2660F0" stroke-width="1.3"/>
            <rect x="5.65" y="6.15" width="5.7" height="2.7" rx="1.35" stroke="#2660F0" stroke-width="1.3"/>
          </svg>
          <div class="modal-title-content">
            <h2 class="modal-title">Visualizar Calendário</h2>
            <div class="modal-title-underline"></div>
          </div>
        </div>
        <button class="btn-close" (click)="onClose()" aria-label="Fechar modal">
          <svg class="close-icon" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 14L14 1" stroke="#757575" stroke-width="2" stroke-linecap="round"/>
            <path d="M14 14L1 1" stroke="#757575" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <!-- Content -->
      <main class="modal-content">
        <h3 class="section-title">Características do Calendário</h3>

        <div class="characteristics-grid">
          <div class="field">
            <label for="instituicao-field">Instituição</label>
            <input id="instituicao-field" class="input-field" type="text" [value]="calendarItem()?.exchange ?? 'B3'" readonly />
          </div>

          <div class="field">
            <label for="praca-field">Praça</label>
            <input id="praca-field" class="input-field" type="text" [value]="calendarItem()?.location ?? 'São Paulo'" readonly />
          </div>

          <div class="field">
            <label for="segmento-field">Segmento</label>
            <input id="segmento-field" class="input-field" type="text" [value]="calendarItem()?.segment ?? 'Cetip UTVM'" readonly />
          </div>

          <div class="field">
            <label for="processo-field">Processo</label>
            <input id="processo-field" class="input-field" type="text" [value]="calendarItem()?.process ?? 'Registro'" readonly />
          </div>

          <div class="field-checkboxes">
            <label class="checkbox-label">
              <input type="checkbox" [checked]="calendarItem()?.saturdayWorkDay === 'true'" disabled />
              <span>Sábado Útil?</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" [checked]="calendarItem()?.sundayWorkDay === 'true'" disabled />
              <span>Domingo Útil?</span>
            </label>
          </div>

          <div class="field-ano-export">
            <div class="field">
              <label for="ano-field">Ano</label>
              <div class="select-wrapper">
                <select id="ano-field" class="select-field" [(ngModel)]="selectedYear">
                  <option [value]="2024">2024</option>
                  <option [value]="2025">2025</option>
                  <option [value]="2026">2026</option>
                  <option [value]="2027">2027</option>
                </select>
                <svg class="dropdown-icon" width="11" height="7" viewBox="0 0 11 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 1.5L5.5 6L10 1.5" stroke="#757575" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <svg class="export-icon" width="35" height="35" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg" (click)="onExport()" style="cursor: pointer;">
              <path d="M5 0.5H30C32.4853 0.5 34.5 2.51472 34.5 5V30C34.5 32.4853 32.4853 34.5 30 34.5H5C2.51472 34.5 0.5 32.4853 0.5 30V5C0.5 2.51472 2.51472 0.5 5 0.5Z" stroke="#2660F0"/>
              <path d="M10.6572 10H18.783L22.4394 13.6564V17.2002H21.1303V15.2365H17.2029V11.3091H11.9664V23.0913H15.8937V24.4004H10.6572V10ZM18.512 11.5801V13.9274H20.8593L18.512 11.5801ZM21.163 18.5669L24.3429 21.7835L21.163 25L20.2322 24.0797L21.8555 22.438H17.2016V21.1289H21.8555L20.2322 19.4873L21.163 18.5669Z" fill="#2660F0"/>
            </svg>
          </div>
        </div>

        <!-- Tabela de Feriados -->
        <div class="table-section">
          <srf-b3-grid
            [columns]="holidayColumns"
            [data]="holidays()"
            [trackByKey]="'data'"
            [showColumnDividers]="true"
            [showSortIcon]="true"
          />
        </div>
      </main>

      <!-- Footer -->
      <footer class="modal-footer">
        <button class="btn-close-footer" (click)="onClose()">
          Fechar
        </button>
      </footer>
    </div>
  </div>
}
