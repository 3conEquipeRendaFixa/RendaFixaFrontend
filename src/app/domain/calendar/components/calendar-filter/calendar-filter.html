<section class="filter-container">
  <div class="filter-row">
    <div class="filter-field">
      <label for="exchange">Instituição</label>
      <select id="exchange" [(ngModel)]="exchange">
        <option value="">Selecione...</option>
        @for (option of filterOptions().exchanges; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </div>

    <div class="filter-field">
      <label for="location">Praça</label>
      <select id="location" [(ngModel)]="location">
        <option value="">Selecione...</option>
        @for (option of filterOptions().locations; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </div>

    <div class="filter-field">
      <label for="segment">Segmento</label>
      <select id="segment" [(ngModel)]="segment">
        <option value="">Selecione...</option>
        @for (option of filterOptions().segments; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </div>

    <div class="filter-field">
      <label for="process">Processo</label>
      <select id="process" [(ngModel)]="process">
        <option value="">Selecione...</option>
        @for (option of filterOptions().processes; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </div>
  </div>

  <div class="filter-actions">
    <srf-b3-button-secondary (clicked)="onClear()">Limpar</srf-b3-button-secondary>
    <srf-b3-button-primary (clicked)="onSearch()">Pesquisar</srf-b3-button-primary>
  </div>
</section>
