<header class="header">
    <div class="header-left">
        @if (showMenuIcon()) {
            <button class="menu-btn" (click)="goToRoot()" title="Home" aria-label="Go to home">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="3" y="6" width="18" height="2" rx="1"></rect>
                <rect x="3" y="11" width="18" height="2" rx="1"></rect>
                <rect x="3" y="16" width="18" height="2" rx="1"></rect>
                </svg>
            </button>
        }
        <div class="logo-b3">
        <img src="icons/Logo.svg" alt="B3 Logo">
        </div>
        <span class="header-title">Sinacor Renda Fixa</span>
    </div>
    <div class="header-right">
        <div class="user-avatar">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        </div>
        <span class="company-name">Empresa [UAT 3099]</span>
    </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <span class="footer-text">Copyright © 2026 SINACOR RENDA FIXA</span>
  <div class="footer-logo">
    <img src="icons/Logo.svg" alt="B3 Logo">
  </div>
  <span class="footer-text">Versão 22.3.1.1475 / Angular: 21</span>
</footer>
